<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73" />
      <stop offset="50%" stop-color="#F4C430" />
      <stop offset="100%" stop-color="#C59619" />
    </linearGradient>

    <!-- Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="60%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#4D7C0F" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4C430" />
      <stop offset="45%" stop-color="#EAB308" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Circular Ring Emblem -->
  <g transform="translate(250, 150)" filter="url(#subtleGlow)">
    <!-- Outer Ring (Gold at top, Blue at bottom) -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#ringGrad)" stroke-width="9" />

    <!-- Top Medical Cross in Gold -->
    <g transform="translate(0, -78)">
      <rect x="-6" y="-18" width="12" height="36" rx="2.5" fill="url(#goldGrad)" />
      <rect x="-18" y="-6" width="36" height="12" rx="2.5" fill="url(#goldGrad)" />
    </g>

    <!-- Central Head (Blue Sphere) -->
    <circle cx="0" cy="-30" r="17" fill="url(#blueGrad)" />

    <!-- Flowing Human Body / Uplifted Arms forming a Nexus & Heart Shape -->
    <!-- Left Uplifted Arm & Body -->
    <path d="M 0,-5 C -22,-18 -44,-42 -44,-70 C -44,-72 -38,-72 -34,-66 C -24,-48 -14,-32 -4,-18 C -12,10 -22,42 0,72 C -32,38 -22,-2 -15,-20 Z" 
          fill="url(#blueGrad)" />

    <!-- Right Uplifted Arm -->
    <path d="M 0,-5 C 22,-18 44,-42 44,-70 C 44,-72 38,-72 34,-66 C 24,-48 14,-32 4,-18 C 12,10 22,42 0,72 C 32,38 22,-2 15,-20 Z" 
          fill="url(#blueGrad)" opacity="0.9" />

    <!-- Green Vibrant Vitality Leaf Nestled on the Right -->
    <path d="M 4,0 C 18,12 40,30 42,56 C 42,66 32,74 20,74 C 10,74 4,64 2,52 C 0,34 2,16 4,0 Z" 
          fill="url(#leafGrad)" />
    <!-- Leaf Center Vein -->
    <path d="M 4,4 Q 22,38 28,68" fill="none" stroke="#A3E635" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Typography matching exact uploaded artwork -->
  <g text-anchor="middle" id="brand-text">
    <!-- PRANAVA in Silver/Charcoal Relief Serif -->
    <text x="250" y="325" 
          font-family="'Cinzel', 'Playfair Display', serif" 
          font-size="44" 
          font-weight="700" 
          letter-spacing="5" 
          fill="#475569">PRANAVA</text>

    <!-- — NEXUS — in Rich Gold -->
    <text x="250" y="365" 
          font-family="'Cinzel', 'Playfair Display', serif" 
          font-size="34" 
          font-weight="700" 
          letter-spacing="7" 
          fill="url(#goldGrad)">— NEXUS —</text>

    <!-- C A R E in Medical Blue -->
    <text x="250" y="400" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="22" 
          font-weight="700" 
          letter-spacing="14" 
          fill="#0284C7">CARE</text>

    <!-- Tagline: — One Nexus. Endless Opportunities. — -->
    <text x="250" y="435" 
          font-family="'Playfair Display', serif" 
          font-size="14" 
          font-style="italic" 
          font-weight="500" 
          letter-spacing="1.2" 
          fill="#64748B">— One Nexus. Endless Opportunities. —</text>
  </g>
</svg>
